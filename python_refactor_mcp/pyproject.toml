[project]
name = "python-refactor-mcp"
version = "0.1.0"
description = "Deterministic Python refactor MCP powered by Rope"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=2.12",
    "pydantic>=2.10",
    "rope>=1.13",
    "pyright[nodejs]>=1.1.400",
    "libcst>=1.5",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
python-refactor-mcp = "python_refactor_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/python_refactor_mcp"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["fixtures", ".venv", "dist", "build"]
filterwarnings = [
    "ignore:Delete once deprecated functions are gone:DeprecationWarning",
]
